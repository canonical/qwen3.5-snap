name: llamacpp-jetson

servers:
  openai:
    protocol: http
    base-path: /v1

environment:
  # Add llama.cpp binaries
  - PATH=$PATH:$SNAP_COMPONENTS/llamacpp-jetson/usr/local/bin
  # Add llama.cpp-built shared libraries
  - LD_LIBRARY_PATH=$LD_LIBRARY_PATH:$SNAP_COMPONENTS/llamacpp-jetson/usr/local/lib
  - LD_LIBRARY_PATH=$LD_LIBRARY_PATH:$SNAP_COMPONENTS/llamacpp-jetson/usr/local/bin
  # Add shared libraries from staged debian packages
  - LD_LIBRARY_PATH=$LD_LIBRARY_PATH:$SNAP_COMPONENTS/llamacpp-jetson/usr/lib/$ARCH_TRIPLET
  - LD_LIBRARY_PATH=$LD_LIBRARY_PATH:$SNAP_COMPONENTS/llamacpp-jetson/usr/lib/$ARCH_TRIPLET/nvidia
  - LD_LIBRARY_PATH=$LD_LIBRARY_PATH:$SNAP_COMPONENTS/llamacpp-jetson/usr/lib/$ARCH_TRIPLET/tegra
  # Add shared libraries from the NVIDIA Jetson CUDA toolkit
  - LD_LIBRARY_PATH=$LD_LIBRARY_PATH:$SNAP_COMPONENTS/llamacpp-jetson/usr/local/cuda-12.6/targets/aarch64-linux/lib

components:
  - llamacpp-jetson
