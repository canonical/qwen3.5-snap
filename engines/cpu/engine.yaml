name: cpu
summary: Optimized for various CPUs
description: |
  This engine uses llama.cpp.

  It is optimized for both amd64 and arm64 CPU architectures, for a wide range
  of architecture variants.
vendor: Canonical Ltd

devices:
  anyof:
    - type: cpu
      architecture: amd64
    - type: cpu
      architecture: arm64

runtime: llamacpp

model:
  default: qwen3.5-4b
  options:
    - qwen3.5-0.8b
    - qwen3.5-2b
    - qwen3.5-4b
    - qwen3.5-9b
    - qwen3.5-35b

configurations:
  sleep-idle-seconds: 600
  min-context-size: 4096
