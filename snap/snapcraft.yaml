name: qwen35-orin-core24
base: core24
version: 'v1'
summary: Qwen 3.5 inference snap for Jetson Orin Nano
description: |
  Inference snap for Qwen 3.5 4B using a CUDA-enabled llama.cpp backend
  for NVIDIA Jetson Orin Nano.

grade: devel
confinement: strict

platforms:
  arm64:
    build-on: [arm64]
    build-for: [arm64]

package-repositories:
  - type: apt
    formats: [deb]
    path: /
    key-id: EB693B3035CD5710E231E123A4B469963BF863CC
    url: https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/sbsa
  # The Jetson repos provide the Tegra (aarch64-linux) CUDA runtime libraries.
  # They must outrank the SBSA repo above, otherwise apt selects the SBSA
  # cuBLAS build (it carries a higher version number) which is compiled for
  # discrete-GPU ARM servers and fails cublasCreate() on Jetson's integrated
  # unified-memory GPU (CUDA "resource allocation failed" during image/CLIP
  # encoding). A higher priority forces the Tegra cuBLAS to be staged.
  - type: apt
    priority: 1000
    key-id: 3C6D1FF3100C8C3ABB0869C0E6543461A9996195
    url: https://repo.download.nvidia.com/jetson/common
    suites: [r36.4]
    components: [main]
  - type: apt
    priority: 1000
    key-id: 3C6D1FF3100C8C3ABB0869C0E6543461A9996195
    url: https://repo.download.nvidia.com/jetson/t234
    suites: [r36.4]
    components: [main]

environment:
  # Set path to snap components
  SNAP_COMPONENTS: /snap/$SNAP_INSTANCE_NAME/components/$SNAP_REVISION
  # To find shared libraries that are staged and moved to components
  ARCH_TRIPLET: $CRAFT_ARCH_TRIPLET_BUILD_FOR

hooks:
  install:
    plugs: &install-plugs
      # For hardware detection
      - hardware-observe
      - opengl
  post-refresh:
    plugs: *install-plugs

parts:
  component-local-files:
    plugin: dump
    source: components
    organize:
      "llama-cpp-cuda": (component/llama-cpp-cuda)
      "model-qwen35-4b-ud-q4-k-xl": (component/model-qwen35-4b-ud-q4-k-xl)
      "model-qwen35-4b-mmproj-bf16": (component/model-qwen35-4b-mmproj-bf16)

  model-qwen35-4b-ud-q4-k-xl:
    source: https://huggingface.co/unsloth/Qwen3.5-4B-GGUF/resolve/main/Qwen3.5-4B-UD-Q4_K_XL.gguf
    source-type: file
    plugin: dump
    organize:
      "Qwen3.5-4B-UD-Q4_K_XL.gguf": (component/model-qwen35-4b-ud-q4-k-xl)/Qwen3.5-4B-UD-Q4_K_XL.gguf

  model-qwen35-4b-mmproj-bf16:
    source: https://huggingface.co/unsloth/Qwen3.5-4B-GGUF/resolve/main/mmproj-BF16.gguf
    source-type: file
    plugin: dump
    organize:
      "mmproj-BF16.gguf": (component/model-qwen35-4b-mmproj-bf16)/mmproj-BF16.gguf

  llama-cpp-cuda:
    source: https://github.com/ggml-org/llama.cpp.git
    source-depth: 1
    plugin: cmake
    build-packages:
      - cuda-nvcc-12-6
      - cuda-cudart-dev-12-6
      - libcublas-dev-12-6
    cmake-parameters:
      - -DGGML_CUDA=ON
      - -DGGML_BACKEND_DL=ON
      - -DCMAKE_CUDA_COMPILER=/usr/local/cuda-12.6/bin/nvcc
      # Jetson Orin uses NVIDIA Ampere GPU compute capability 8.7.
      - -DCMAKE_CUDA_ARCHITECTURES=87
    stage-packages:
      - cuda-cudart-12-6
      - libcublas-12-6
      - libgomp1
      - nvidia-l4t-cuda
    organize:
      # Move everything, including staged CUDA runtime libraries, to the runtime component.
      "*": (component/llama-cpp-cuda)

  engines:
    source: engines
    plugin: dump
    organize:
      "*": engines/

  models:
    source: models
    plugin: dump
    organize:
      "*": models/

  runtimes:
    source: runtimes
    plugin: dump
    organize:
      "*": runtimes/

  cli:
    source:
      - on amd64: https://github.com/canonical/inference-snaps-cli/releases/download/v2.0.0-beta.4/inference-snaps-cli-linux-amd64.tar.xz
      - on arm64: https://github.com/canonical/inference-snaps-cli/releases/download/v2.0.0-beta.4/inference-snaps-cli-linux-arm64.tar.xz
    plugin: dump
    override-build: |
      # For tab completion
      ln --symbolic ./modelctl bin/qwen35-orin-core24

      craftctl default
    
  cli-dependencies:
    plugin: nil
    stage-packages:
      - pciutils # lspci
      - clinfo # used for Intel GPU vRAM detection. It depends on intel-opencl-icd

  scripts:
    source: scripts
    plugin: dump
    stage-packages:
      - jq # used in server.sh
    organize:
      "server.sh": bin/

components:
  model-qwen35-4b-ud-q4-k-xl:
    type: standard
    summary: Qwen 3.5 4B UD-Q4_K_XL GGUF
    description: Quantized Qwen 3.5 4B model in GGUF format with UD-Q4_K_XL encoding

  model-qwen35-4b-mmproj-bf16:
    type: standard
    summary: Qwen 3.5 4B multimodal projector
    description: Multimodal projector for Qwen 3.5 4B image inputs in GGUF format (BF16 precision)

  llama-cpp-cuda:
    type: standard
    summary: CUDA-enabled llama.cpp HTTP server
    description: llama.cpp HTTP server built with CUDA support for Jetson Orin Nano

apps:
  qwen35-orin-core24:
    command: bin/modelctl
    completer: bin/snap-completer.bash
    plugs:
      # For hardware detection
      - hardware-observe
      - opengl
      # To access server over network socket
      - network
    environment:
      ADDITIONAL_FEATURES: chat, webui

  server:
    command: bin/server.sh
    daemon: simple
    plugs:
      # Needed for server app
      - network-bind
      # For inference and when running some modelctl commands
      - hardware-observe
      - opengl
