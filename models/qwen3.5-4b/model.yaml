name: qwen3.5-4b

description: |
  Qwen 3.5 4B, Q4_K_XL GGUF quantization, with multimodal (vision) projection
  weights.
model-card-url: https://huggingface.co/unsloth/Qwen3.5-4B-GGUF
quantization: Q4_K_XL

disk-size: 2910M

capabilities:
  - text
  - vision
  - thinking
  - tools

components:
  - model-q4-k-xl-gguf
  - mmproj-4b-q4-k-xl

environment:
  - MODEL_FILE=$SNAP_COMPONENTS/model-q4-k-xl-gguf/Qwen3.5-4B-UD-Q4_K_XL.gguf
  - MMPROJ_FILE=$SNAP_COMPONENTS/mmproj-4b-q4-k-xl/mmproj-BF16.gguf
  - MODEL_NAME=qwen-3-5-4b-q4-k-xl
