environment:
# Default OpenAI base path for llama.cpp HTTP server
- OPENAI_BASE_PATH=/v1
# Add llama.cpp binaries
- PATH=$PATH:$COMPONENT/usr/local/bin
# Add llama.cpp-built shared libraries
- LD_LIBRARY_PATH=$LD_LIBRARY_PATH:$COMPONENT/usr/local/lib
- LD_LIBRARY_PATH=$LD_LIBRARY_PATH:$COMPONENT/usr/local/bin
# Add shared libraries added via staged debian packages
- LD_LIBRARY_PATH=$LD_LIBRARY_PATH:$COMPONENT/usr/lib/$ARCH_TRIPLET
- LD_LIBRARY_PATH=$LD_LIBRARY_PATH:$COMPONENT/usr/lib/$ARCH_TRIPLET/nvidia
- LD_LIBRARY_PATH=$LD_LIBRARY_PATH:$COMPONENT/usr/lib/$ARCH_TRIPLET/nvidia/current
# Add shared libraries from NVIDIA CUDA toolkit packages
- LD_LIBRARY_PATH=$LD_LIBRARY_PATH:$COMPONENT/usr/local/cuda-12.6/targets/aarch64-linux/lib
- LD_LIBRARY_PATH=$LD_LIBRARY_PATH:$COMPONENT/usr/local/cuda-12.6/targets/sbsa-linux/lib
